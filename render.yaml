services:
  - type: web
    name: aquarelay
    runtime: python
    plan: free
    buildCommand: npm ci && npm run build && pip install -r backend/requirements.txt
    startCommand: cd backend && python -m app.launch
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_MODE
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: EMBEDDED_WORKER
        value: "true"
      - key: STATIC_PATH
        value: ../dist
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: evidence
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
